scopes:
    - name: extensions
      description: Pi extension commands, menus, context, and commit validation in extensions/; does not cover behavioral specifications.
    - name: features
      description: Gherkin behavior specifications for git-agent interactions in features/; does not cover executable extension code.
    - name: procedures
      description: Git workflow and commit-operation guidance in procedures/; does not cover CLI reference material.
    - name: references
      description: CLI delegation and attribution reference documentation in references/; does not cover step-by-step procedures.
    - name: tests
      description: Automated extension behavior tests in tests/; does not cover Gherkin feature specifications.
